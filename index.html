<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAISON — Al Bari & Amabel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Italiana&family=Inter:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        cormorant: ['Cormorant Garamond', 'serif'],
                        italiana: ['Italiana', 'serif'],
                        inter: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        /* === THEME VARIABLES === */
        :root {
            --bg: #FDF8F3;
            --bg-alt: #F8F0E8;
            --card: #FFFFFF;
            --text: #3D2C2C;
            --text-sec: #8B7B7B;
            --primary: #D4728C;
            --primary-rgb: 212,114,140;
            --primary-light: #F8E8ED;
            --primary-dark: #B85A72;
            --accent: #C9A96E;
            --accent-rgb: 201,169,110;
            --accent-light: #F5ECD8;
            --border: rgba(61,44,44,0.08);
            --shadow: rgba(61,44,44,0.06);
            --overlay: rgba(61,44,44,0.45);
            --input-bg: rgba(61,44,44,0.03);
            --grain-opacity: 0.025;
        }
        body.dark {
            --bg: #1A1614;
            --bg-alt: #221E1C;
            --card: #2A2424;
            --text: #F0E6E0;
            --text-sec: #9B8B85;
            --primary: #E0889E;
            --primary-rgb: 224,136,158;
            --primary-light: #351E25;
            --primary-dark: #D4728C;
            --accent: #D4B87A;
            --accent-rgb: 212,184,122;
            --accent-light: #2E2818;
            --border: rgba(240,230,224,0.07);
            --shadow: rgba(0,0,0,0.25);
            --overlay: rgba(0,0,0,0.65);
            --input-bg: rgba(240,230,224,0.04);
            --grain-opacity: 0.03;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow-x: hidden;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        /* Grain overlay */
        body::after {
            content: '';
            position: fixed; inset: -50%;
            width: 200%; height: 200%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            opacity: var(--grain-opacity);
            pointer-events: none;
            z-index: 9998;
        }

        /* Page transitions */
        .page-enter { animation: pageIn 0.5s cubic-bezier(0.22,1,0.36,1) forwards; }
        @keyframes pageIn { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:translateY(0); } }

        /* Stagger */
        .stagger > * { opacity:0; animation: stIn 0.6s cubic-bezier(0.22,1,0.36,1) forwards; }
        .stagger > *:nth-child(1){animation-delay:.05s} .stagger > *:nth-child(2){animation-delay:.1s}
        .stagger > *:nth-child(3){animation-delay:.15s} .stagger > *:nth-child(4){animation-delay:.2s}
        .stagger > *:nth-child(5){animation-delay:.25s} .stagger > *:nth-child(6){animation-delay:.3s}
        .stagger > *:nth-child(7){animation-delay:.35s} .stagger > *:nth-child(8){animation-delay:.4s}
        @keyframes stIn { from{opacity:0;transform:translateY(22px)} to{opacity:1;transform:translateY(0)} }

        /* Brand card hover */
        .brand-card { position:relative; overflow:hidden; cursor:pointer; transition: transform 0.6s cubic-bezier(0.22,1,0.36,1), box-shadow 0.6s ease; }
        .brand-card:hover { transform:translateY(-8px); }
        .brand-card .card-bg { transition: transform 0.8s cubic-bezier(0.22,1,0.36,1); }
        .brand-card:hover .card-bg { transform:scale(1.07); }
        .brand-card .card-border { position:absolute;inset:0;border:1.5px solid transparent;transition:all .5s ease;pointer-events:none;z-index:5;border-radius:inherit; }
        .brand-card:hover .card-border { border-color: var(--primary); box-shadow: 0 0 50px rgba(var(--primary-rgb),0.15), inset 0 0 30px rgba(var(--primary-rgb),0.05); }

        /* Product card */
        .product-card .p-img { transition: transform 0.7s cubic-bezier(0.22,1,0.36,1); }
        .product-card:hover .p-img { transform:scale(1.06); }
        .product-card .qv { opacity:0; transform:translateY(8px); transition:all .4s cubic-bezier(0.22,1,0.36,1); }
        .product-card:hover .qv { opacity:1; transform:translateY(0); }

        /* Cart sidebar */
        .cart-sidebar { position:fixed;top:0;right:0;width:min(440px,92vw);height:100vh;z-index:1001;transform:translateX(100%);transition:transform .5s cubic-bezier(0.22,1,0.36,1);overflow-y:auto; }
        .cart-sidebar.open { transform:translateX(0); }
        .cart-ov { position:fixed;inset:0;background:var(--overlay);backdrop-filter:blur(4px);z-index:1000;opacity:0;pointer-events:none;transition:opacity .4s ease; }
        .cart-ov.open { opacity:1;pointer-events:all; }

        /* Modal */
        .modal-ov { position:fixed;inset:0;background:var(--overlay);backdrop-filter:blur(6px);z-index:2000;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s ease; }
        .modal-ov.open { opacity:1;pointer-events:all; }
        .modal-c { transform:scale(.95) translateY(10px); transition:transform .4s cubic-bezier(0.22,1,0.36,1); }
        .modal-ov.open .modal-c { transform:scale(1) translateY(0); }

        /* Toast */
        .toast { animation: tIn .4s cubic-bezier(0.22,1,0.36,1) forwards; }
        .toast.out { animation: tOut .3s ease forwards; }
        @keyframes tIn { from{opacity:0;transform:translateX(40px)} to{opacity:1;transform:translateX(0)} }
        @keyframes tOut { from{opacity:1;transform:translateX(0)} to{opacity:0;transform:translateX(40px)} }

        /* Form inputs */
        .fi { background:var(--input-bg);border:1px solid var(--border);border-radius:8px;padding:12px 16px;color:var(--text);font-family:'Inter',sans-serif;font-size:14px;width:100%;transition:border-color .2s,box-shadow .2s;outline:none; }
        .fi:focus { border-color:var(--primary);box-shadow:0 0 0 3px rgba(var(--primary-rgb),0.12); }
        .fi.err { border-color:#e74c3c;box-shadow:0 0 0 3px rgba(231,76,60,0.1); }
        .fi::placeholder { color:var(--text-sec);opacity:.5; }

        /* Size & color selectors */
        .sz-btn { transition:all .2s ease; }
        .sz-btn.sel { background:var(--primary)!important;color:#fff!important;border-color:var(--primary)!important; }
        .csw { width:28px;height:28px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:all .2s; }
        .csw.sel { border-color:var(--primary);box-shadow:0 0 0 2px rgba(var(--primary-rgb),0.3); }

        /* Payment toggle */
        .pay-opt { border:1px solid var(--border);border-radius:10px;padding:16px 20px;cursor:pointer;transition:all .3s; }
        .pay-opt.sel { border-color:var(--primary);background:rgba(var(--primary-rgb),0.06); }

        /* Success animation */
        .suc-chk { width:72px;height:72px;border-radius:50%;border:3px solid var(--accent);display:flex;align-items:center;justify-content:center;animation:sucPop .5s cubic-bezier(0.22,1,0.36,1) forwards; }
        @keyframes sucPop { 0%{transform:scale(0);opacity:0} 60%{transform:scale(1.15)} 100%{transform:scale(1);opacity:1} }

        /* Decorative line */
        .deco-line { width:50px;height:1px;background:linear-gradient(90deg,transparent,var(--primary),transparent); }

        /* Scrollbar */
        ::-webkit-scrollbar { width:5px; }
        ::-webkit-scrollbar-track { background:transparent; }
        ::-webkit-scrollbar-thumb { background:rgba(var(--primary-rgb),0.2);border-radius:3px; }

        /* Badge pulse */
        @keyframes bPulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.25)} }
        .b-pulse { animation:bPulse .3s ease; }

        /* Floating elements for landing */
        .float-el { position:absolute;border-radius:50%;filter:blur(60px);pointer-events:none;animation:floatDrift 8s ease-in-out infinite alternate; }
        @keyframes floatDrift { 0%{transform:translate(0,0) scale(1)} 100%{transform:translate(30px,-20px) scale(1.1)} }

        /* Loading screen */
        #loading-screen { transition:opacity .5s ease; }
        #loading-screen.hide { opacity:0;pointer-events:none; }

        /* Timeline */
        .tl-dot { width:14px;height:14px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .3s; }
        .tl-dot.done { border-color:var(--primary);background:var(--primary); }
        .tl-dot.active { border-color:var(--primary);box-shadow:0 0 0 4px rgba(var(--primary-rgb),0.2); }
        .tl-line { width:2px;background:var(--border);flex-shrink:0;transition:background .3s; }
        .tl-line.done { background:var(--primary); }

        /* Theme toggle */
        .theme-btn { position:relative;width:44px;height:24px;border-radius:12px;background:var(--border);border:none;cursor:pointer;transition:background .3s; }
        .theme-btn::after { content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--accent);transition:transform .3s cubic-bezier(0.22,1,0.36,1); }
        body.dark .theme-btn { background:rgba(var(--primary-rgb),0.25); }
        body.dark .theme-btn::after { transform:translateX(20px);background:var(--primary); }

        @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms!important;transition-duration:.01ms!important; } }
        @media (max-width:768px) { .brand-card { min-height:50vh!important; } }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen" class="fixed inset-0 z-[10000] flex flex-col items-center justify-center" style="background:var(--bg)">
        <div class="w-8 h-8 border-2 rounded-full animate-spin" style="border-color:var(--primary);border-top-color:transparent"></div>
        <p class="mt-4 font-cormorant text-lg tracking-wider" style="color:var(--text)">Maison</p>
    </div>

    <div id="app" role="main" aria-live="polite"></div>
    <div id="cart-ov" class="cart-ov"></div>
    <aside id="cart-sb" class="cart-sidebar" role="complementary" aria-label="Shopping cart"></aside>
    <div id="modal-ov" class="modal-ov" role="dialog" aria-modal="true"></div>
    <div id="chk-modal" class="modal-ov" role="dialog" aria-modal="true" style="z-index:3000"></div>
    <div id="toast-c" class="fixed top-6 right-6 z-[9999] flex flex-col gap-3 pointer-events-none"></div>

    <script>
    /* ================================================================
       SUPABASE SQL SCHEMA — Run this in your Supabase SQL Editor
       ================================================================
       CREATE TABLE products (
         id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
         brand_id TEXT NOT NULL,
         title TEXT NOT NULL,
         slug TEXT UNIQUE NOT NULL,
         description TEXT,
         base_price DECIMAL(10,2) NOT NULL,
         featured_image TEXT NOT NULL,
         images TEXT[],
         variants JSONB NOT NULL DEFAULT '[]',
         created_at TIMESTAMPTZ DEFAULT NOW()
       );
       CREATE TABLE orders (
         id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
         tracking_id TEXT UNIQUE NOT NULL,
         customer_name TEXT NOT NULL,
         customer_email TEXT NOT NULL,
         customer_phone TEXT,
         shipping_address TEXT NOT NULL,
         city TEXT NOT NULL,
         postal_code TEXT,
         payment_method TEXT NOT NULL,
         payment_status TEXT DEFAULT 'pending',
         total_amount DECIMAL(10,2) NOT NULL,
         items JSONB NOT NULL DEFAULT '[]',
         status TEXT DEFAULT 'placed',
         status_history JSONB DEFAULT '[]',
         created_at TIMESTAMPTZ DEFAULT NOW()
       );
       ALTER TABLE products ENABLE ROW LEVEL SECURITY;
       ALTER TABLE orders ENABLE ROW LEVEL SECURITY;
       CREATE POLICY "Public read products" ON products FOR SELECT USING (true);
       CREATE POLICY "Public insert orders" ON orders FOR INSERT WITH CHECK (true);
       CREATE POLICY "Public read orders" ON orders FOR SELECT USING (true);
       ================================================================ */

    // ==================== CLOUD CONFIGURATION ====================
    // Fill in your credentials below to enable cloud features.
    // The app works fully in local mode without any configuration.
    const CLOUD = {
        supabase: { url: 'https://hricsdskzxcbhcrhuzpm.supabase.co/rest/v1/', anonKey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhyaWNzZHNrenhjYmhjcmh1enBtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0OTEyNjUsImV4cCI6MjEwMzA2NzI2NX0.KUtdIzTMKDpVsHoQO9YORRc8-bTSMQpbfg9Z2iD4tVk' },
        emailjs: { serviceId: '', templateId: '', publicKey: '' },
        get supaOk() { return !!(this.supabase.url && this.supabase.anonKey); },
        get mailOk() { return !!(this.emailjs.serviceId && this.emailjs.templateId && this.emailjs.publicKey); }
    };

    // ==================== DATABASE LAYER ====================
    let _supabase = null;
    if (CLOUD.supaOk) { _supabase = supabase.createClient(CLOUD.supabase.url, CLOUD.supabase.anonKey); }
    if (CLOUD.mailOk) { emailjs.init(CLOUD.emailjs.publicKey); }

    const db = {
        async getProducts() {
            if (_supabase) {
                try {
                    const { data, error } = await _supabase.from('products').select('*').order('created_at', { ascending: false });
                    if (!error && data?.length) return data.map(normalizeProduct);
                } catch(e) { console.warn('[DB] Supabase fetch failed, using local data:', e); }
            }
            return null; // signals to use local data
        },
        async createOrder(order) {
            if (_supabase) {
                try {
                    const { data, error } = await _supabase.from('orders').insert(sanitizeOrder(order)).select().single();
                    if (!error && data) return data;
                } catch(e) { console.warn('[DB] Supabase insert failed, using local:', e); }
            }
            // Local fallback: localStorage
            const orders = JSON.parse(localStorage.getItem('maison_orders') || '[]');
            orders.push(order);
            localStorage.setItem('maison_orders', JSON.stringify(orders));
            return order;
        },
        async findOrder(query) {
            if (_supabase) {
                try {
                    const { data } = await _supabase.from('orders').select('*').eq('tracking_id', query).single();
                    if (data) return data;
                    const { data: d2 } = await _supabase.from('orders').select('*').eq('customer_email', query).order('created_at', { ascending: false }).limit(1).single();
                    if (d2) return d2;
                } catch(e) { console.warn('[DB] Lookup failed:', e); }
            }
            const orders = JSON.parse(localStorage.getItem('maison_orders') || '[]');
            return orders.find(o => o.tracking_id === query || o.customer_email === query) || null;
        },
        async sendConfirmation(order) {
            if (CLOUD.mailOk) {
                try {
                    const itemsText = order.items.map(i => `${i.title} (${i.size}/${i.color}) x${i.quantity} — ${i.unit_price * i.quantity} SAR`).join('\n');
                    await emailjs.send(CLOUD.emailjs.serviceId, CLOUD.emailjs.templateId, {
                        to_email: order.customer_email,
                        to_name: order.customer_name,
                        order_id: order.tracking_id,
                        order_date: new Date(order.created_at).toLocaleDateString('en-SA', { year:'numeric',month:'long',day:'numeric' }),
                        order_total: order.total_amount.toLocaleString('en-SA') + ' SAR',
                        order_items: itemsText,
                        tracking_url: window.location.origin + window.location.pathname + '#/track?id=' + order.tracking_id
                    });
                    console.log('[Email] Confirmation sent to', order.customer_email);
                } catch(e) { console.warn('[Email] Send failed:', e); }
            } else {
                console.log('[Email] Would send confirmation to:', order.customer_email, '(configure EmailJS to enable)');
            }
        }
    };

    function normalizeProduct(row) {
        return {
            id: row.id, brand_id: row.brand_id, title: row.title, slug: row.slug,
            description: row.description, base_price: parseFloat(row.base_price),
            featured_image: row.featured_image, images: row.images || [row.featured_image],
            variants: row.variants || []
        };
    }
    function sanitizeOrder(o) {
        return {
            tracking_id: o.tracking_id, customer_name: o.customer_name, customer_email: o.customer_email,
            customer_phone: o.customer_phone || '', shipping_address: o.shipping_address,
            city: o.city, postal_code: o.postal_code || '', payment_method: o.payment_method,
            total_amount: o.total_amount, items: JSON.stringify(o.items),
            status: o.status || 'placed', status_history: JSON.stringify(o.status_history || [])
        };
    }

    // ==================== THEME ====================
    function initTheme() {
        const saved = localStorage.getItem('maison_theme');
        if (saved === 'dark') document.body.classList.add('dark');
    }
    function toggleTheme() {
        document.body.classList.toggle('dark');
        localStorage.setItem('maison_theme', document.body.classList.contains('dark') ? 'dark' : 'light');
        renderApp(getRoute());
        renderOverlays();
    }

    // ==================== DATA ====================
    const brands = {
        'al-bari': {
            id:'al-bari', name:'Al Bari', slug:'al-bari',
            tagline:'Modest Abaya Couture',
            description:'Where tradition meets contemporary elegance. Each abaya is a testament to refined modesty, crafted with precision from the finest crepe and silk fabrics sourced from premium mills across the Middle East and Asia.',
            heroImage:'https://picsum.photos/seed/albarihero2/1400/700',
            sizes:['XS','S','M','L','XL','XXL'],
            colorOptions:[{name:'Black',hex:'#2a2222'},{name:'Rose',hex:'#D4728C'},{name:'Ivory',hex:'#F5F0E8'},{name:'Blush',hex:'#F4D6DC'}]
        },
        'amabel': {
            id:'amabel', name:'Amabel', slug:'amabel',
            tagline:'Luxury Intimates & Sleepwear',
            description:'Whispers of silk and lace, designed for the woman who commands her private world with equal parts softness and strength. Every piece is an invitation to indulge in the art of feeling beautiful.',
            heroImage:'https://picsum.photos/seed/amabelhero2/1400/700',
            sizes:['XS','S','M','L'],
            colorOptions:[{name:'Blush',hex:'#F4E2DE'},{name:'Onyx',hex:'#2a2222'},{name:'Rose',hex:'#D4728C'},{name:'Champagne',hex:'#E8D8CE'}]
        }
    };

    function genVariants(slug, price) {
        const b = brands[slug], v = [];
        b.sizes.forEach(s => b.colorOptions.forEach(c => {
            v.push({ id:'v-'+Math.random().toString(36).substr(2,9), size:s, color:c.name, colorHex:c.hex,
                stock: Math.random()<0.12 ? 0 : Math.floor(Math.random()*8)+1, price_override:null });
        }));
        return v;
    }

    let localProducts = [
        { id:'p1', brand_id:'al-bari', title:'Royal Rose Abaya', slug:'royal-rose-abaya',
          description:'A majestic abaya featuring hand-embroidered rose-gold threads along the sleeves and hem. Crafted from premium crepe with a subtle sheen that catches light with every movement. The structured silhouette flows into a gentle A-line cut.',
          base_price:2450, featured_image:'https://picsum.photos/seed/roseabaya/600/800',
          images:['https://picsum.photos/seed/roseabaya/600/800','https://picsum.photos/seed/roseabaya2/600/800'], variants:genVariants('al-bari',2450) },
        { id:'p2', brand_id:'al-bari', title:'Champagne Embroidered Abaya', slug:'champagne-abaya',
          description:'Drenched in warm champagne embroidery that traces botanical patterns across the bodice and cuffs. Each motif takes hours of meticulous handwork by skilled artisans.',
          base_price:1890, featured_image:'https://picsum.photos/seed/champabaya/600/800',
          images:['https://picsum.photos/seed/champabaya/600/800','https://picsum.photos/seed/champabaya2/600/800'], variants:genVariants('al-bari',1890) },
        { id:'p3', brand_id:'al-bari', title:'Ivory Grace Open Abaya', slug:'ivory-grace-abaya',
          description:'An open-front abaya in soft ivory crepe, designed for effortless layering. Clean lines and absence of embellishment speak to a philosophy of understated luxury.',
          base_price:1650, featured_image:'https://picsum.photos/seed/ivoryabaya2/600/800',
          images:['https://picsum.photos/seed/ivoryabaya2/600/800','https://picsum.photos/seed/ivoryabaya3/600/800'], variants:genVariants('al-bari',1650) },
        { id:'p4', brand_id:'al-bari', title:'Midnight Blush Abaya', slug:'midnight-blush-abaya',
          description:'A commanding piece in deep midnight with subtle blush satin piping along the princess seams. High collar and concealed placket create an architectural silhouette.',
          base_price:2200, featured_image:'https://picsum.photos/seed/midblush/600/800',
          images:['https://picsum.photos/seed/midblush/600/800','https://picsum.photos/seed/midblush2/600/800'], variants:genVariants('al-bari',2200) },
        { id:'p5', brand_id:'al-bari', title:'Petal Cascade Abaya', slug:'petal-cascade-abaya',
          description:'Inspired by falling petals, this abaya features a fluted hemline that moves like silk in the wind. Warm rose-gold threadwork at the neckline adds romanticism.',
          base_price:1950, featured_image:'https://picsum.photos/seed/petalabaya/600/800',
          images:['https://picsum.photos/seed/petalabaya/600/800','https://picsum.photos/seed/petalabaya2/600/800'], variants:genVariants('al-bari',1950) },
        { id:'p6', brand_id:'al-bari', title:'Pearl Lattice Crystal Abaya', slug:'pearl-lattice-abaya',
          description:'The pinnacle of the collection. Hand-sewn crystals cascade from the shoulders in a lattice pattern. A masterpiece for those who understand that true luxury whispers.',
          base_price:3100, featured_image:'https://picsum.photos/seed/pearlabaya2/600/800',
          images:['https://picsum.photos/seed/pearlabaya2/600/800','https://picsum.photos/seed/pearlabaya3/600/800'], variants:genVariants('al-bari',3100) },
        { id:'p7', brand_id:'amabel', title:'Rose Petal Silk Set', slug:'rose-petal-silk-set',
          description:'A two-piece sleepwear set in washed silk charmeuse. The camisole features delicate French lace trim, while wide-leg pants drape with liquid grace.',
          base_price:890, featured_image:'https://picsum.photos/seed/rosesilk2/600/800',

    // --- STOREFRONT ---
    function renderStore(slug) {
        const b=brands[slug], prods=getFiltered(slug), hf=slug==='al-bari'?'font-cormorant':'font-italiana';
        return `
        ${headerHTML(true, b.name)}
        <section class="relative pt-16 overflow-hidden" style="background:var(--bg)">
            <div class="relative h-[38vh] md:h[48vh] overflow-hidden">
                <img src="${b.heroImage}" alt="${b.name}" class="w-full h-full object-cover" style="filter:brightness(0.5)">
                <div class="absolute inset-0" style="background:linear-gradient(to top,var(--bg) 0%,transparent 60%)"></div>
                <div class="absolute inset-0 flex items-center justify-center text-center px-6">
                    <div class="stagger">
                        <p class="font-inter text-[10px] md:text-xs tracking-[0.5em] uppercase mb-4" style="color:var(--primary)">${b.tagline}</p>
                        <h1 class="${hf} text-5xl md:text-7xl lg:text-8xl font-light tracking-wide" style="color:var(--text)">${b.name}</h1>
                        <p class="mt-4 max-w-lg mx-auto font-inter text-sm leading-relaxed" style="color:var(--text-sec)">${b.description}</p>
                    </div>
                </div>
            </div>
        </section>
        <section class="pb-24" style="background:var(--bg)">
            <div class="max-w-7xl mx-auto px-5 md:px-10">
                <div class="flex flex-wrap items-center justify-between gap-4 py-6" style="border-bottom:1px solid var(--border)">
                    <div class="flex flex-wrap items-center gap-3">
                        <span class="font-inter text-xs tracking-widest uppercase" style="color:var(--text-sec)">${prods.length} Pieces</span>
                        <div class="w-px h-4" style="background:var(--border)"></div>
                        <div class="flex gap-1.5">${b.sizes.map(s=>`<button data-action="tgl-size" data-size="${s}" class="sz-btn px-2.5 py-1 text-[11px] font-inter rounded border transition-all ${S.filters.sizes.includes(s)?'sel':''}" style="color:var(--text);border-color:var(--border);background:transparent">${s}</button>`).join('')}</div>
                        <div class="w-px h-4" style="background:var(--border)"></div>
                        <div class="flex gap-2">${b.colorOptions.map(c=>`<button data-action="tgl-color" data-color="${c.name}" class="csw ${S.filters.colors.includes(c.name)?'sel':''}" style="background:${c.hex};${['#F5F0E8','#F4E2DE','#E8D8CE'].includes(c.hex)?'box-shadow:inset 0 0 0 1px rgba(0,0,0,0.12)':''}" title="${c.name}"></button>`).join('')}</div>
                        ${(S.filters.sizes.length||S.filters.colors.length)?`<button data-action="reset-filters" class="font-inter text-[11px] underline transition-opacity hover:opacity-60" style="color:var(--primary)">Clear</button>`:''}
                    </div>
                    <select data-action="set-sort" class="font-inter text-xs px-3 py-2 rounded-lg border outline-none cursor-pointer" style="color:var(--text);background:var(--card);border-color:var(--border)">
                        <option value="featured" ${S.filters.sort==='featured'?'selected':''}>Featured</option>
                        <option value="price-asc" ${S.filters.sort==='price-asc'?'selected':''}>Price: Low to High</option>
                        <option value="price-desc" ${S.filters.sort==='price-desc'?'selected':''}>Price: High to Low</option>
                    </select>
                </div>
                ${prods.length?`<div class="grid grid-cols-2 md:grid-cols-3 gap-4 md:gap-6 mt-8 stagger">${prods.map(p=>renderPCard(p,b)).join('')}</div>`
                :`<div class="text-center py-20"><i data-lucide="search-x" class="w-12 h-12 mx-auto mb-4" style="color:var(--text-sec)"></i><p class="font-inter text-sm" style="color:var(--text-sec)">No pieces match your filters.</p><button data-action="reset-filters" class="mt-4 font-inter text-xs underline" style="color:var(--primary)">Reset</button></div>`}
            </div>
        </section>`;
    }
    function renderPCard(p,b) {
        return `<article class="product-card group cursor-pointer" data-action="open-product" data-pid="${p.id}">
            <div class="relative aspect-[3/4] rounded-xl overflow-hidden" style="background:var(--bg-alt)">
                <img src="${p.featured_image}" alt="${p.title}" class="p-img w-full h-full object-cover" loading="lazy">
                <div class="qv absolute inset-0 flex items-end justify-center pb-6" style="background:linear-gradient(to top,rgba(var(--primary-rgb),0.45) 0%,transparent 50%)">
                    <span class="font-inter text-[11px] tracking-[0.3em] uppercase px-5 py-2.5 rounded-full" style="color:#fff;background:rgba(255,255,255,0.15);backdrop-filter:blur(8px)">Quick View</span>
                </div>
            </div>
            <div class="mt-3"><h3 class="font-inter text-sm font-medium truncate" style="color:var(--text)">${p.title}</h3><p class="font-inter text-sm mt-1" style="color:var(--primary)">${fmt(p.base_price)}</p></div>
        </article>`;
    }

    // --- TRACKING PAGE ---
    function renderTracking() {
        return `
        ${headerHTML()}
        <section class="pt-24 pb-20 px-6 min-h-screen" style="background:var(--bg)">
            <div class="max-w-2xl mx-auto">
                <div class="text-center mb-12 stagger">
                    <div class="deco-line mx-auto mb-6"></div>
                    <h1 class="font-cormorant text-3xl md:text-5xl font-light" style="color:var(--text)">Track Your Order</h1>
                    <p class="mt-3 font-inter text-sm" style="color:var(--text-sec)">Enter your tracking ID or email to locate your order</p>
                </div>
                <form data-action="track-order" class="flex gap-2 mb-10">
                    <input type="text" id="track-input" placeholder="Tracking ID or email address" class="fi flex-1" value="${new URLSearchParams(window.location.hash.split('?')[1]||'').get('id')||''}">
                    <button type="submit" class="px-6 py-3 rounded-lg font-inter text-xs tracking-widest uppercase transition-all hover:opacity-90 flex-shrink-0" style="background:var(--primary);color:#fff">Track</button>
                </form>
                <div id="track-results">
                    ${S.trackingLoading?`<div class="text-center py-10"><div class="w-8 h-8 border-2 rounded-full animate-spin mx-auto" style="border-color:var(--primary);border-top-color:transparent"></div><p class="mt-3 font-inter text-sm" style="color:var(--text-sec)">Searching...</p></div>`:''}
                    ${renderTrackingResult()}
                </div>
            </div>
        </section>`;
    }
    function renderTrackingResult() {
        const o=S.trackingResult;
        if(o===null && !S.trackingLoading) return '';
        if(o===false) return `<div class="text-center py-12 rounded-2xl" style="background:var(--card);border:1px solid var(--border)"><i data-lucide="package-x" class="w-12 h-12 mx-auto mb-4" style="color:var(--text-sec)"></i><p class="font-inter text-sm" style="color:var(--text-sec)">No order found. Please check your tracking ID or email and try again.</p></div>`;
        if(!o) return '';
        const items = typeof o.items === 'string' ? JSON.parse(o.items) : o.items;
        const hist = typeof o.status_history === 'string' ? JSON.parse(o.status_history) : (o.status_history||[]);
        const statuses = ['placed','processing','quality_check','shipped','out_for_delivery','delivered'];
        const statusLabels = {placed:'Order Placed',processing:'Processing',quality_check:'Quality Check',shipped:'Shipped',out_for_delivery:'Out for Delivery',delivered:'Delivered'};
        const currentIdx = statuses.indexOf(o.status||'placed');
        return `
        <div class="rounded-2xl overflow-hidden" style="background:var(--card);border:1px solid var(--border)">
            <div class="p-6 md:p-8" style="border-bottom:1px solid var(--border)">
                <div class="flex flex-wrap items-start justify-between gap-4">
                    <div>
                        <p class="font-inter text-[10px] tracking-[0.4em] uppercase" style="color:var(--primary)">Order</p>
                        <p class="font-cormorant text-xl mt-1" style="color:var(--text)">${o.tracking_id}</p>
                    </div>
                    <div class="text-right">
                        <p class="font-inter text-[10px] tracking-[0.4em] uppercase" style="color:var(--text-sec)">Status</p>
                        <p class="font-inter text-sm font-medium mt-1" style="color:var(--primary)">${statusLabels[o.status]||o.status}</p>
                    </div>
                </div>
                <p class="font-inter text-xs mt-3" style="color:var(--text-sec)">Placed on ${new Date(o.created_at).toLocaleDateString('en-SA',{year:'numeric',month:'long',day:'numeric',hour:'2-digit',minute:'2-digit'})}</p>
            </div>

            <!-- Timeline -->
            <div class="p-6 md:p-8" style="border-bottom:1px solid var(--border)">
                <p class="font-inter text-[10px] tracking-[0.3em] uppercase mb-6" style="color:var(--text-sec)">Tracking Timeline</p>
                <div class="space-y-0">
                    ${statuses.map((s,i)=>{
                        const done=i<=currentIdx;
                        const active=i===currentIdx;
                        const hEntry=hist.find(h=>h.status===s);
                        const time=hEntry?new Date(hEntry.time).toLocaleString('en-SA',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}):(done?(i===0?new Date(o.created_at).toLocaleString('en-SA',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}):''):'');
                        return `<div class="flex gap-4">
                            <div class="flex flex-col items-center">
                                <div class="tl-dot ${done?'done':''} ${active?'active':''}">
                                    ${done?'<i data-lucide="check" class="w-2.5 h-2.5" style="color:#fff"></i>':''}
                                </div>
                                ${i<statuses.length-1?`<div class="tl-line ${done?'done':''}" style="min-height:32px"></div>`:''}
                            </div>
                            <div class="pb-6">
                                <p class="font-inter text-sm ${done?'':'opacity-40'}" style="color:var(--text)">${statusLabels[s]}</p>
                                ${time?`<p class="font-inter text-[11px] mt-0.5" style="color:var(--text-sec)">${time}</p>`:''}
                            </div>
                        </div>`;
                    }).join('')}
                </div>
            </div>

            <!-- Items -->
            <div class="p-6 md:p-8" style="border-bottom:1px solid var(--border)">
                <p class="font-inter text-[10px] tracking-[0.3em] uppercase mb-4" style="color:var(--text-sec)">Order Items</p>
                <div class="space-y-3">
                    ${(items||[]).map(it=>`<div class="flex items-center gap-3">
                        <div class="w-12 h-14 rounded-lg overflow-hidden flex-shrink-0" style="background:var(--bg-alt)">
                            <img src="${it.image||'https://picsum.photos/seed/item/100/120'}" alt="" class="w-full h-full object-cover">
                        </div>
                        <div class="flex-1 min-w-0">
                            <p class="font-inter text-sm truncate" style="color:var(--text)">${it.title}</p>
                            <p class="font-inter text-[11px]" style="color:var(--text-sec)">${it.size} / ${it.color} x${it.quantity}</p>
                        </div>
                        <p class="font-inter text-sm" style="color:var(--text)">${fmt(it.unit_price*it.quantity)}</p>
                    </div>`).join('')}
                </div>
                <div class="flex justify-between mt-5 pt-4" style="border-top:1px solid var(--border)">
                    <span class="font-inter text-sm" style="color:var(--text)">Total</span>
                    <span class="font-inter text-lg font-medium" style="color:var(--primary)">${fmt(parseFloat(o.total_amount))}</span>
                </div>
            </div>

            <!-- Shipping Info -->
            <div class="p-6 md:p-8">
                <div class="grid grid-cols-2 gap-6">
                    <div>
                        <p class="font-inter text-[10px] tracking-[0.3em] uppercase mb-2" style="color:var(--text-sec)">Shipping To</p>
                        <p class="font-inter text-sm" style="color:var(--text)">${o.shipping_address}</p>
                        <p class="font-inter text-sm" style="color:var(--text)">${o.city} ${o.postal_code||''}</p>
                    </div>
                    <div>
                        <p class="font-inter text-[10px] tracking-[0.3em] uppercase mb-2" style="color:var(--text-sec)">Payment</p>
                        <p class="font-inter text-sm capitalize" style="color:var(--text)">${o.payment_method==='cod'?'Cash on Delivery':'Credit/Debit Card'}</p>
                        <p class="font-inter text-sm capitalize" style="color:var(--text-sec)">${o.payment_status||'pending'}</p>
                    </div>
                </div>
            </div>
        </div>`;
    }

    // --- PRODUCT MODAL ---
    function renderProdModal() {
        const p=S.modalProduct; if(!p) return '';
        const b=brands[p.brand_id], hf=b.id==='al-bari'?'font-cormorant':'font-italiana';
        const sv=S.mv, mv=sv.size&&sv.color?p.variants.find(v=>v.size===sv.size&&v.color===sv.color):null;
        const oos=mv&&mv.stock===0, canAdd=mv&&mv.stock>0;
        const price=mv?(mv.price_override||p.base_price):p.base_price;
        return `<div class="modal-c w-full max-w-4xl max-h-[92vh] mx-4 rounded-2xl overflow-hidden shadow-2xl" style="background:var(--card)">
            <div class="grid grid-cols-1 md:grid-cols-2 h-full overflow-y-auto">
                <div class="relative aspect-square md:aspect-auto md:min-h-[580px]" style="background:var(--bg-alt)">
                    <img src="${p.featured_image}" alt="${p.title}" class="w-full h-full object-cover">
                    <button data-action="close-prod" class="absolute top-4 left-4 p-2 rounded-full transition-opacity hover:opacity-60" style="background:var(--card);backdrop-filter:blur(8px);color:var(--text)" aria-label="Close"><i data-lucide="x" class="w-5 h-5"></i></button>
                </div>
                <div class="p-6 md:p-10 flex flex-col">
                    <p class="font-inter text-[10px] tracking-[0.4em] uppercase mb-2" style="color:var(--primary)">${b.name}</p>
                    <h2 class="${hf} text-3xl md:text-4xl font-light tracking-wide" style="color:var(--text)">${p.title}</h2>
                    <p class="font-inter text-xl mt-3" style="color:var(--primary)">${fmt(price)}</p>
                    <p class="font-inter text-sm leading-relaxed mt-5" style="color:var(--text-sec)">${p.description}</p>
                    <div class="mt-8">
                        <label class="font-inter text-xs tracking-widest uppercase block mb-3" style="color:var(--text)">Size</label>
                        <div class="flex flex-wrap gap-2">${b.sizes.map(s=>{const hs=p.variants.some(v=>v.size===s&&v.stock>0),sel=sv.size===s;return`<button data-action="sel-size" data-size="${s}" class="sz-btn px-4 py-2.5 text-xs font-inter rounded-lg border transition-all ${sel?'sel':''} ${!hs?'opacity-25 cursor-not-allowed line-through':'cursor-pointer'}" style="color:var(--text);border-color:var(--border);background:transparent" ${!hs?'disabled':''}>${s}</button>`;}).join('')}</div>
                    </div>
                    <div class="mt-6">
                        <label class="font-inter text-xs tracking-widest uppercase block mb-3" style="color:var(--text)">Color — ${sv.color||'Select'}</label>
                        <div class="flex gap-3">${b.colorOptions.map(c=>{const hs=p.variants.some(v=>v.color===c.name&&v.stock>0),sel=sv.color===c.name;return`<button data-action="sel-color" data-color="${c.name}" class="csw ${sel?'sel':''} ${!hs?'opacity-15 cursor-not-allowed':''}" style="background:${c.hex};${['#F5F0E8','#F4E2DE','#E8D8CE'].includes(c.hex)?'box-shadow:inset 0 0 0 1px rgba(0,0,0,0.12)':''}" title="${c.name}" ${!hs?'disabled':''}></button>`;}).join('')}</div>
                    </div>
                    <div class="mt-4 min-h-[22px]">${oos?`<p class="font-inter text-xs text-[#e74c3c]">This combination is out of stock</p>`:canAdd?`<p class="font-inter text-xs" style="color:var(--text-sec)">${mv.stock} in stock</p>`:(sv.size||sv.color)?`<p class="font-inter text-xs" style="color:var(--primary)">Please select both size and color</p>`:''}</div>
                    <div class="mt-auto pt-6">
                        <button data-action="add-cart" ${!canAdd?'disabled':''} class="w-full py-4 rounded-lg font-inter text-sm tracking-widest uppercase transition-all ${canAdd?'cursor-pointer hover:opacity-90 active:scale-[0.98]':'opacity-35 cursor-not-allowed'}" style="background:var(--primary);color:#fff">${canAdd?'Add to Bag':'Select Options'}</button>
                    </div>
                </div>
            </div>
        </div>`;
    }

    // --- CART SIDEBAR ---
    function renderCart() {
        if(!S.cart.length) return `<div class="h-full flex flex-col" style="background:var(--card)">
            <div class="flex items-center justify-between p-6" style="border-bottom:1px solid var(--border)"><h3 class="font-cormorant text-2xl tracking-wider" style="color:var(--text)">Your Bag</h3><button data-action="close-cart" class="p-2 hover:opacity-60 transition-opacity" style="color:var(--text)" aria-label="Close"><i data-lucide="x" class="w-5 h-5"></i></button></div>
            <div class="flex-1 flex flex-col items-center justify-center px-8 text-center"><i data-lucide="shopping-bag" class="w-16 h-16 mb-5" style="color:var(--border)"></i><p class="font-inter text-sm" style="color:var(--text-sec)">Your bag is empty</p><button data-action="close-cart" class="mt-6 font-inter text-xs tracking-widest uppercase hover:opacity-60 transition-opacity" style="color:var(--primary)">Continue Shopping</button></div></div>`;
        return `<div class="h-full flex flex-col" style="background:var(--card)">
            <div class="flex items-center justify-between p-6" style="border-bottom:1px solid var(--border)"><h3 class="font-cormorant text-2xl tracking-wider" style="color:var(--text)">Your Bag <span class="font-inter text-sm" style="color:var(--text-sec)">(${S.count()})</span></h3><button data-action="close-cart" class="p-2 hover:opacity-60 transition-opacity" style="color:var(--text)" aria-label="Close"><i data-lucide="x" class="w-5 h-5"></i></button></div>
            <div class="flex-1 overflow-y-auto p-6 space-y-5">${S.cart.map((it,i)=>`<div class="flex gap-4 pb-5" style="border-bottom:1px solid var(--border)">
                <div class="w-20 h-24 rounded-lg overflow-hidden flex-shrink-0" style="background:var(--bg-alt)"><img src="${it.product.featured_image}" alt="" class="w-full h-full object-cover"></div>
                <div class="flex-1 min-w-0">
                    <div class="flex items-start justify-between gap-2"><div><p class="font-inter text-sm truncate" style="color:var(--text)">${it.product.title}</p><p class="font-inter text-[11px] mt-0.5" style="color:var(--text-sec)">${it.variant.size} / ${it.variant.color}</p></div><button data-action="rm-cart" data-idx="${i}" class="p-1 hover:opacity-60 transition-opacity" style="color:var(--text-sec)" aria-label="Remove"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button></div>
                    <div class="flex items-center justify-between mt-3"><div class="flex items-center rounded-lg" style="border:1px solid var(--border)"><button data-action="dec-qty" data-idx="${i}" class="px-2.5 py-1.5 text-sm hover:opacity-60 transition-opacity" style="color:var(--text-sec)">-</button><span class="px-3 py-1.5 text-xs font-inter" style="color:var(--text);border-left:1px solid var(--border);border-right:1px solid var(--border)">${it.quantity}</span><button data-action="inc-qty" data-idx="${i}" class="px-2.5 py-1.5 text-sm hover:opacity-60 transition-opacity" style="color:var(--text-sec)">+</button></div><p class="font-inter text-sm" style="color:var(--primary)">${fmt(it.unit_price*it.quantity)}</p></div>
                </div></div>`).join('')}</div>
            <div class="p-6" style="border-top:1px solid var(--border)">
                <div class="flex items-center justify-between mb-5"><span class="font-inter text-sm" style="color:var(--text-sec)">Subtotal</span><span class="font-inter text-lg" style="color:var(--text)">${fmt(S.total())}</span></div>
                <p class="font-inter text-[11px] mb-4" style="color:var(--text-sec);opacity:.6">Shipping & taxes calculated at checkout</p>
                <button data-action="open-chk" class="w-full py-4 rounded-lg font-inter text-sm tracking-widest uppercase transition-all hover:opacity-90 active:scale-[0.98]" style="background:var(--primary);color:#fff">Checkout</button>
            </div></div>`;
    }

    // --- CHECKOUT MODAL ---
    function renderChk() {
        if(S.orderSuccess) return `<div class="modal-c w-full max-w-md mx-4 rounded-2xl p-10 text-center" style="background:var(--card)">
            <div class="suc-chk mx-auto mb-6"><i data-lucide="check" class="w-8 h-8" style="color:var(--accent)"></i></div>
            <h3 class="font-cormorant text-3xl" style="color:var(--text)">Order Confirmed</h3>
            <p class="font-inter text-sm mt-3" style="color:var(--text-sec)">Thank you! A confirmation email has been sent. You can track your order below.</p>
            <p class="font-inter text-xs tracking-widest mt-4" style="color:var(--primary)">${S.orderNumber}</p>
            <div class="flex flex-col gap-3 mt-8">
                <button data-action="goto-track" data-id="${S.orderNumber}" class="px-8 py-3 rounded-lg font-inter text-xs tracking-widest uppercase transition-all hover:opacity-90" style="background:var(--primary);color:#fff">Track Order</button>
                <button data-action="close-chk" class="px-8 py-3 rounded-lg font-inter text-xs tracking-widest uppercase border transition-all hover:opacity-60" style="border-color:var(--border);color:var(--text)">Continue Shopping</button>
            </div></div>`;
        return `<div class="modal-c w-full max-w-3xl mx-4 rounded-2xl overflow-hidden shadow-2xl" style="background:var(--card)">
            <div class="flex items-center justify-between p-6" style="border-bottom:1px solid var(--border)"><h3 class="font-cormorant text-2xl tracking-wider" style="color:var(--text)">Checkout</h3><button data-action="close-chk" class="p-2 hover:opacity-60 transition-opacity" style="color:var(--text-sec)" aria-label="Close"><i data-lucide="x" class="w-5 h-5"></i></button></div>
            <div class="grid grid-cols-1 md:grid-cols-5 max-h-[70vh] overflow-y-auto">
                <div class="md:col-span-3 p-6 md:p-8 space-y-5">
                    <div><p class="font-inter text-xs tracking-widest uppercase mb-4" style="color:var(--primary)">Contact Information</p>
                        <div class="space-y-3">
                            <div><label class="font-inter text-[11px] block mb-1.5" style="color:var(--text-sec)">Full Name</label><input type="text" id="c-name" class="fi" placeholder="Your full name" required><p class="fe text-[11px] text-[#e74c3c] mt-1 hidden"></p></div>
                            <div class="grid grid-cols-2 gap-3">
                                <div><label class="font-inter text-[11px] block mb-1.5" style="color:var(--text-sec)">Email</label><input type="email" id="c-email" class="fi" placeholder="email@example.com" required><p class="fe text-[11px] text-[#e74c3c] mt-1 hidden"></p></div>
                                <div><label class="font-inter text-[11px] block mb-1.5" style="color:var(--text-sec)">Phone</label><input type="tel" id="c-phone" class="fi" placeholder="+966 5X XXX XXXX" required><p class="fe text-[11px] text-[#e74c3c] mt-1 hidden"></p></div>
                            </div>
                        </div>
                    </div>
                    <div><p class="font-inter text-xs tracking-widest uppercase mb-4" style="color:var(--primary)">Shipping Address</p>
                        <div class="space-y-3">
                            <div><label class="font-inter text-[11px] block mb-1.5" style="color:var(--text-sec)">Address</label><input type="text" id="c-addr" class="fi" placeholder="Street, building, apartment" required><p class="fe text-[11px] text-[#e74c3c] mt-1 hidden"></p></div>
                            <div class="grid grid-cols-2 gap-3">
                                <div><label class="font-inter text-[11px] block mb-1.5" style="color:var(--text-sec)">City</label><input type="text" id="c-city" class="fi" placeholder="City" required><p class="fe text-[11px] text-[#e74c3c] mt-1 hidden"></p></div>
                                <div><label class="font-inter text-[11px] block mb-1.5" style="color:var(--text-sec)">Postal Code</label><input type="text" id="c-post" class="fi" placeholder="12345"></div>
                            </div>
                        </div>
                    </div>
                    <div><p class="font-inter text-xs tracking-widest uppercase mb-4" style="color:var(--primary)">Payment Method</p>
                        <div class="space-y-3">
                            <div class="pay-opt flex items-center gap-4 ${S._payMethod!=='cod'?'sel':''}" data-action="sel-pay" data-method="card">
                                <div class="w-5 h-5 rounded-full border-2 flex items-center justify-center flex-shrink-0" style="border-color:${S._payMethod!=='cod'?'var(--primary)':'var(--border)'}">${S._payMethod!=='cod'?'<div class="w-2.5 h-2.5 rounded-full" style="background:var(--primary)"></div>':''}</div>
                                <i data-lucide="credit-card" class="w-5 h-5" style="color:var(--text-sec)"></i><span class="font-inter text-sm" style="color:var(--text)">Credit / Debit Card</span>
                            </div>
                            ${S._payMethod!=='cod'?`<div class="space-y-3 pl-9"><input type="text" id="c-card" class="fi" placeholder="1234 5678 9012 3456" maxlength="19"><div class="grid grid-cols-2 gap-3"><input type="text" id="c-exp" class="fi" placeholder="MM / YY" maxlength="7"><input type="text" id="c-cvv" class="fi" placeholder="CVV" maxlength="4"></div></div>`:''}
                            <div class="pay-opt flex items-center gap-4 ${S._payMethod==='cod'?'sel':''}" data-action="sel-pay" data-method="cod">
                                <div class="w-5 h-5 rounded-full border-2 flex items-center justify-center flex-shrink-0" style="border-color:${S._payMethod==='cod'?'var(--primary)':'var(--border)'}">${S._payMethod==='cod'?'<div class="w-2.5 h-2.5 rounded-full" style="background:var(--primary)"></div>':''}</div>
                                <i data-lucide="banknote" class="w-5 h-5" style="color:var(--text-sec)"></i><span class="font-inter text-sm" style="color:var(--text)">Cash on Delivery</span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="md:col-span-2 p-6 md:p-8 md:border-l" style="border-top:1px solid var(--border);background:var(--bg)">
                    <p class="font-inter text-xs tracking-widest uppercase mb-5" style="color:var(--primary)">Order Summary</p>
                    <div class="space-y-3 mb-6">${S.cart.map(it=>`<div class="flex items-center gap-3"><div class="w-12 h-14 rounded-md overflow-hidden flex-shrink-0" style="background:var(--bg-alt)"><img src="${it.product.featured_image}" alt="" class="w-full h-full object-cover"></div><div class="flex-1 min-w-0"><p class="font-inter text-xs truncate" style="color:var(--text)">${it.product.title}</p><p class="font-inter text-[10px]" style="color:var(--text-sec)">${it.variant.size}/${it.variant.color} x${it.quantity}</p></div><p class="font-inter text-xs" style="color:var(--text-sec)">${fmt(it.unit_price*it.quantity)}</p></div>`).join('')}</div>
                    <div class="pt-4 space-y-2" style="border-top:1px solid var(--border)">
                        <div class="flex justify-between"><span class="font-inter text-xs" style="color:var(--text-sec)">Subtotal</span><span class="font-inter text-xs" style="color:var(--text)">${fmt(S.total())}</span></div>
                        <div class="flex justify-between"><span class="font-inter text-xs" style="color:var(--text-sec)">Shipping</span><span class="font-inter text-xs" style="color:var(--text-sec)">Calculated later</span></div>
                        <div class="flex justify-between pt-3 mt-3" style="border-top:1px solid var(--border)"><span class="font-inter text-sm" style="color:var(--text)">Total</span><span class="font-inter text-lg" style="color:var(--primary)">${fmt(S.total())}</span></div>
                    </div>
                    <button data-action="place-order" class="w-full mt-6 py-4 rounded-lg font-inter text-sm tracking-widest uppercase transition-all hover:opacity-90 active:scale-[0.98]" style="background:var(--primary);color:#fff">Place Order</button>
                    <p class="font-inter text-[10px] text-center mt-3" style="color:var(--text-sec);opacity:.4">By placing this order, you agree to our terms of service.</p>
                </div>
            </div></div>`;
    }

    // ==================== OVERLAY RENDERING ====================
    function renderOverlays() {
        const cs=document.getElementById('cart-sb'), co=document.getElementById('cart-ov');
        cs.innerHTML=renderCart(); cs.classList.toggle('open',S.cartOpen);
        co.classList.toggle('open',S.cartOpen);
        lucide.createIcons({nodes:[cs]});

        const mo=document.getElementById('modal-ov');
        if(S.modalProduct){mo.innerHTML=renderProdModal();mo.classList.add('open');}else{mo.innerHTML='';mo.classList.remove('open');}
        lucide.createIcons({nodes:[mo]});

        const cm=document.getElementById('chk-modal');
        if(S.chkOpen){cm.innerHTML=renderChk();cm.classList.add('open');}else{cm.innerHTML='';cm.classList.remove('open');}
        lucide.createIcons({nodes:[cm]});
    }

    // ==================== EVENT HANDLERS ====================
    document.addEventListener('click', e => {
        const t=e.target.closest('[data-action]'); if(!t) return;
        const a=t.dataset.action;
        switch(a) {
            case 'nav': navigate(t.dataset.target); break;
            case 'toggle-theme': toggleTheme(); break;
            case 'open-cart': S.toggleCart(true); break;
            case 'close-cart': S.toggleCart(false); break;
            case 'open-product': { const p=activeProducts.find(x=>x.id===t.dataset.pid); if(p) S.openProd(p); break; }
            case 'close-prod': S.closeProd(); break;
            case 'sel-size': S.mv.size=t.dataset.size; renderOverlays(); break;
            case 'sel-color': S.mv.color=t.dataset.color; renderOverlays(); break;
            case 'add-cart': { const p=S.modalProduct,v=p.variants.find(x=>x.size===S.mv.size&&x.color===S.mv.color); if(v&&v.stock>0){S.addCart(p,v);S.closeProd();} break; }
            case 'rm-cart': S.removeCart(parseInt(t.dataset.idx)); break;
            case 'inc-qty': S.setQty(parseInt(t.dataset.idx),S.cart[parseInt(t.dataset.idx)].quantity+1); break;
            case 'dec-qty': S.setQty(parseInt(t.dataset.idx),S.cart[parseInt(t.dataset.idx)].quantity-1); break;
            case 'open-chk': S.openChk(); break;
            case 'close-chk': S.closeChk(); break;
            case 'sel-pay': S._payMethod=t.dataset.method; renderOverlays(); break;
            case 'goto-track': S.closeChk(); navigate('/track?id='+t.dataset.id); break;
            case 'place-order': handlePlaceOrder(); break;
            case 'tgl-size': { const sz=t.dataset.size,szArr=[...S.filters.sizes],i=szArr.indexOf(sz); if(i>-1)szArr.splice(i,1);else szArr.push(sz); S.setFilter('sizes',szArr); renderApp(getRoute()); renderOverlays(); break; }
            case 'tgl-color': { const cl=t.dataset.color,clArr=[...S.filters.colors],i=clArr.indexOf(cl); if(i>-1)clArr.splice(i,1);else clArr.push(cl); S.setFilter('colors',clArr); renderApp(getRoute()); renderOverlays(); break; }
            case 'reset-filters': S.resetFilters(); renderApp(getRoute()); renderOverlays(); break;
        }
    });

    document.addEventListener('change', e => {
        if(e.target.matches('[data-action="set-sort"]')){ S.setFilter('sort',e.target.value); renderApp(getRoute()); renderOverlays(); }
    });

    // Form submissions
    document.addEventListener('submit', e => {
        const form = e.target.closest('[data-action]');
        if(!form) return;
        e.preventDefault();
        if(form.dataset.action === 'track-order') handleTrackOrder();
        if(form.dataset.action === 'subscribe-newsletter') { showToast('Welcome to the Inner Circle!','success'); form.reset(); }
    });

    // Input formatting
    document.addEventListener('input', e => {
        if(e.target.id==='c-card'){let v=e.target.value.replace(/\D/g,'').substring(0,16);e.target.value=v.replace(/(.{4})/g,'$1 ').trim();}
        if(e.target.id==='c-exp'){let v=e.target.value.replace(/\D/g,'').substring(0,4);if(v.length>=2)v=v.substring(0,2)+' / '+v.substring(2);e.target.value=v;}
        if(e.target.id==='c-cvv') e.target.value=e.target.value.replace(/\D/g,'').substring(0,4);
    });

    // Keyboard
    document.addEventListener('keydown', e => {
        if(e.key==='Escape'){ if(S.chkOpen)S.closeChk(); else if(S.modalProduct)S.closeProd(); else if(S.cartOpen)S.toggleCart(false); }
    });

    // Overlay clicks
    document.getElementById('cart-ov').addEventListener('click',()=>S.toggleCart(false));
    document.getElementById('modal-ov').addEventListener('click',e=>{if(e.target===e.currentTarget)S.closeProd();});
    document.addEventListener('click',e=>{const cm=document.getElementById('chk-modal');if(e.target===cm&&S.chkOpen)S.closeChk();});

    // Brand card keyboard
    document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList.contains('brand-card'))e.target.click();});

    // ==================== ORDER HANDLERS ====================
    async function handlePlaceOrder() {
        const fields=[
            {id:'c-name',lbl:'Name is required'},{id:'c-email',lbl:'Valid email required',type:'email'},
            {id:'c-phone',lbl:'Phone required'},{id:'c-addr',lbl:'Address required'},{id:'c-city',lbl:'City required'}
        ];
        let ok=true;
        fields.forEach(f=>{
            const inp=document.getElementById(f.id); if(!inp) return;
            const err=inp.parentElement.querySelector('.fe');
            let v=inp.value.trim(), valid=v.length>0;
            if(f.type==='email') valid=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
            if(!valid){ok=false;inp.classList.add('err');if(err){err.textContent=f.lbl;err.classList.remove('hidden');}}
            else{inp.classList.remove('err');if(err)err.classList.add('hidden');}
        });
        if(!ok){showToast('Please fill in all required fields','error');return;}

        const trackingId = 'ORD-'+Date.now().toString(36).toUpperCase()+Math.random().toString(36).substr(2,4).toUpperCase();
        const now = new Date().toISOString();
        const orderItems = S.cart.map(it=>({
            title:it.product.title, size:it.variant.size, color:it.variant.color,
            quantity:it.quantity, unit_price:it.unit_price, image:it.product.featured_image
        }));
        const statusHistory = [
            {status:'placed',time:now},
            {status:'processing',time:new Date(Date.now()+3600000).toISOString()}
        ];

        const order = {
            tracking_id:trackingId, customer_name:document.getElementById('c-name').value.trim(),
            customer_email:document.getElementById('c-email').value.trim(),
            customer_phone:document.getElementById('c-phone').value.trim(),
            shipping_address:document.getElementById('c-addr').value.trim(),
            city:document.getElementById('c-city').value.trim(),
            postal_code:document.getElementById('c-post').value.trim(),
            payment_method:S._payMethod, payment_status:S._payMethod==='cod'?'pending':'paid',
            total_amount:S.total(), items:orderItems, status:'placed',
            status_history:statusHistory, created_at:now
        };

        try {
            await db.createOrder(order);
            await db.sendConfirmation(order);
            S.placeOrder(trackingId);
            if(!CLOUD.mailOk) showToast('Confirmation email queued (configure EmailJS to enable delivery)','info');
        } catch(err) {
            console.error('Order error:',err);
            showToast('Something went wrong. Please try again.','error');
        }
    }

    async function handleTrackOrder() {
        const input = document.getElementById('track-input');
        const query = input?.value.trim();
        if(!query) return;
        S.trackingLoading = true;
        S.trackingResult = null;
        renderApp('/track');

        try {
            const order = await db.findOrder(query);
            S.trackingLoading = false;
            S.trackingResult = order || false;
            renderApp('/track');
            lucide.createIcons();
        } catch(err) {
            S.trackingLoading = false;
            S.trackingResult = false;
            renderApp('/track');
            lucide.createIcons();
        }
    }

    // ==================== INITIALIZATION ====================
    S.on(() => renderOverlays());
    initTheme();

    async function init() {
        try {
            const cloudProducts = await db.getProducts();
            if(cloudProducts) {
                activeProducts = cloudProducts;
                console.log('[DB] Loaded', cloudProducts.length, 'products from Supabase');
            } else {
                console.log('[DB] Using local product data');
            }
        } catch(e) {
            console.log('[DB] Using local product data');
        }

        // Check if tracking page with pre-filled ID
        const r = getRoute();
        if(r === '/track') {
            const params = new URLSearchParams(window.location.hash.split('?')[1]||'');
            const prefill = params.get('id');
            if(prefill) {
                setTimeout(()=>handleTrackOrder(), 100);
            }
        }

        // Hide loading screen
        document.getElementById('loading-screen').classList.add('hide');
        setTimeout(()=>document.getElementById('loading-screen').remove(), 500);

        route();
    }

    window.addEventListener('DOMContentLoaded', init);
    window.addEventListener('hashchange', route);
    </script>
</body>
</html>
